<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media over IP Stream Buddy — APK.audio</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #0f1218; color: #e2e8f0; margin: 0; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #283348; padding-bottom: 12px; margin-bottom: 20px; }
    .card { background: #171d27; border: 1px solid #283348; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #222c3d; font-family: monospace; }
    button { background: #0284c7; color: #fff; border: 1px solid #38bdf8; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <div style="display:flex; align-items:center; gap:10px;">
      <span style="font-size:20px;">🌊</span>
      <h2>Media over IP (MoIP) Stream Buddy</h2>
    </div>
    <button id="btn-export">Export SDP Manifest</button>
  </header>

  <div class="card">
    <h3 style="font-size:14px; text-transform:uppercase; color:#94a3b8;">Active Multicast Flows</h3>
    <table>
      <thead>
        <tr><th>Stream Name</th><th>Multicast Group</th><th>Port</th><th>Channels / Format</th><th>Status</th></tr>
      </thead>
      <tbody id="stream-rows"></tbody>
    </table>
  </div>

  <script type="module">
    import { MoipStreamModel } from './js/moipApp.js';
    const model = new MoipStreamModel();
    const tbody = document.getElementById('stream-rows');

    model.streams.forEach(s => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><b>${s.name}</b></td><td>${s.group}</td><td>${s.port}</td><td>${s.channels} (${s.format})</td><td style="color:#34d399;">● ${s.status}</td>`;
      tbody.appendChild(tr);
    });

    document.getElementById('btn-export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(model.streams, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'moip-streams.json';
      a.click();
    });
  </script>
</body>
</html>
